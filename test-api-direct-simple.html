<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Direct API Test - Simple</title>
    <style>
        body { font-family: Arial, sans-serif; margin: 20px; }
        .section { margin: 20px 0; padding: 15px; border: 1px solid #ddd; border-radius: 5px; }
        .error { color: red; }
        .success { color: green; }
        .info { color: blue; }
        pre { background: #f5f5f5; padding: 10px; border-radius: 3px; overflow-x: auto; }
        button { padding: 10px 15px; margin: 5px; cursor: pointer; }
        input { padding: 8px; margin: 5px; width: 300px; }
    </style>
</head>
<body>
    <h1>Direct API Test - Simple</h1>
    
    <div class="section">
        <h3>Step 1: Login</h3>
        <input type="text" id="username" placeholder="Username" value="admin">
        <input type="password" id="password" placeholder="Password" value="">
        <button onclick="login()">Login</button>
        <div id="loginResult"></div>
    </div>

    <div class="section">
        <h3>Step 2: Test Missions API</h3>
        <button onclick="testAPI()">Test API</button>
        <div id="apiResult"></div>
    </div>

    <script>
        let token = null;

        async function login() {
            const username = document.getElementById('username').value;
            const password = document.getElementById('password').value;
            
            try {
                const response = await fetch('http://localhost:5000/api/v1/auth/login', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({
                        username,
                        password,
                        tenantId: 'techcorp_solutions'
                    })
                });
                
                const data = await response.json();
                
                if (data.success) {
                    token = data.token;
                    document.getElementById('loginResult').innerHTML = 
                        `<div class="success">✅ Login successful!</div>
                         <div class="info">Token: ${token.substring(0, 50)}...</div>
                         <div class="info">User: ${JSON.stringify(data.user, null, 2)}</div>`;
                } else {
                    document.getElementById('loginResult').innerHTML = 
                        `<div class="error">❌ Login failed: ${data.message}</div>`;
                }
            } catch (error) {
                document.getElementById('loginResult').innerHTML = 
                    `<div class="error">❌ Error: ${error.message}</div>`;
            }
        }

        async function testAPI() {
            if (!token) {
                document.getElementById('apiResult').innerHTML = 
                    '<div class="error">❌ Please login first</div>';
                return;
            }

            try {
                console.log('🔍 Testing API with token:', token.substring(0, 50) + '...');
                
                const response = await fetch('http://localhost:5000/api/v1/missions', {
                    method: 'GET',
                    headers: {
                        'Authorization': `Bearer ${token}`,
                        'Content-Type': 'application/json'
                    }
                });

                console.log('🔍 Response status:', response.status);
                console.log('🔍 Response headers:', [...response.headers.entries()]);

                const data = await response.json();
                console.log('🔍 Response data:', data);

                let resultHtml = `
                    <div class="info">Status: ${response.status}</div>
                    <div class="info">Success: ${data.success}</div>
                `;

                if (data.success) {
                    resultHtml += `
                        <div class="success">✅ API call successful!</div>
                        <div class="info">Missions count: ${data.data ? data.data.length : 0}</div>
                        <pre>${JSON.stringify(data, null, 2)}</pre>
                    `;
                } else {
                    resultHtml += `
                        <div class="error">❌ API call failed: ${data.message}</div>
                        <pre>${JSON.stringify(data, null, 2)}</pre>
                    `;
                }

                document.getElementById('apiResult').innerHTML = resultHtml;

            } catch (error) {
                console.error('❌ API test error:', error);
                document.getElementById('apiResult').innerHTML = 
                    `<div class="error">❌ Error: ${error.message}</div>`;
            }
        }
    </script>
</body>
</html>
