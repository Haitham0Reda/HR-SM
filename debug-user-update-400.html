<!DOCTYPE html>
<html>
<head>
    <title>Debug User Update 400 Error</title>
    <style>
        body { font-family: Arial, sans-serif; margin: 20px; }
        .success { color: green; }
        .error { color: red; }
        .warning { color: orange; }
        .info { color: blue; }
        pre { background: #f5f5f5; padding: 10px; border-radius: 5px; overflow-x: auto; }
        .test-section { margin: 20px 0; padding: 15px; border: 1px solid #ddd; border-radius: 5px; }
        button { padding: 10px 20px; margin: 5px; background: #007bff; color: white; border: none; border-radius: 5px; cursor: pointer; }
        button:hover { background: #0056b3; }
        input, textarea { padding: 8px; margin: 5px; border: 1px solid #ddd; border-radius: 3px; width: 300px; }
        textarea { height: 100px; }
    </style>
</head>
<body>
    <h1>🔧 Debug User Update 400 Error</h1>
    <div id="output"></div>
    
    <div class="test-section">
        <h3>Test User Update</h3>
        <input type="text" id="userId" placeholder="User ID (6957aaedf166bb9e0c0454c9)" value="6957aaedf166bb9e0c0454c9">
        <br>
        <textarea id="updateData" placeholder="Update data (JSON)">
{
  "personalInfo": {
    "firstName": "Updated Name"
  }
}
        </textarea>
        <br>
        <button onclick="testUserUpdate()">Test User Update</button>
        <button onclick="getUserDetails()">Get User Details First</button>
    </div>
    
    <script>
        const log = (message, type = 'info') => {
            console.log(message);
            const div = document.createElement('div');
            div.className = type;
            div.innerHTML = typeof message === 'object' ? `<pre>${JSON.stringify(message, null, 2)}</pre>` : `<p>${message}</p>`;
            document.getElementById('output').appendChild(div);
        };

        async function getUserDetails() {
            const userId = document.getElementById('userId').value.trim();
            if (!userId) {
                log('❌ Please enter a user ID', 'error');
                return;
            }

            log(`🔍 Getting details for user: ${userId}`, 'info');
            
            const token = localStorage.getItem('tenant_token');
            if (!token) {
                log('❌ No token found in localStorage', 'error');
                return;
            }
            
            try {
                const response = await fetch(`http://localhost:5000/api/v1/users/${userId}`, {
                    headers: {
                        'Authorization': `Bearer ${token}`,
                        'Content-Type': 'application/json'
                    }
                });
                
                const data = await response.json();
                
                log(`📊 GET User Response Status: ${response.status}`, response.status === 200 ? 'success' : 'error');
                log('📊 User Data:', 'info');
                log(data, 'info');
                
                if (response.status === 200 && data.success) {
                    // Pre-fill update data with current user info
                    const currentUser = data.data;
                    const sampleUpdate = {
                        personalInfo: {
                            firstName: currentUser.personalInfo?.firstName || 'Updated Name',
                            lastName: currentUser.personalInfo?.lastName || 'Updated Last'
                        }
                    };
                    document.getElementById('updateData').value = JSON.stringify(sampleUpdate, null, 2);
                }
                
            } catch (error) {
                log(`❌ Network Error: ${error.message}`, 'error');
            }
        }

        async function testUserUpdate() {
            const userId = document.getElementById('userId').value.trim();
            const updateDataText = document.getElementById('updateData').value.trim();
            
            if (!userId) {
                log('❌ Please enter a user ID', 'error');
                return;
            }
            
            if (!updateDataText) {
                log('❌ Please enter update data', 'error');
                return;
            }
            
            let updateData;
            try {
                updateData = JSON.parse(updateDataText);
            } catch (e) {
                log('❌ Invalid JSON in update data', 'error');
                return;
            }
            
            log(`📝 Testing user update for ID: ${userId}`, 'info');
            log('📤 Update data being sent:', 'info');
            log(updateData, 'info');
            
            const token = localStorage.getItem('tenant_token');
            if (!token) {
                log('❌ No token found in localStorage', 'error');
                return;
            }
            
            // Decode token to check user details
            try {
                const payload = JSON.parse(atob(token.split('.')[1]));
                log(`👤 Current user role: ${payload.role}`, 'info');
                log(`👤 Current user ID: ${payload.userId}`, 'info');
                log(`🏢 Tenant ID: ${payload.tenantId}`, 'info');
            } catch (e) {
                log('❌ Failed to decode token', 'error');
            }
            
            try {
                const response = await fetch(`http://localhost:5000/api/v1/users/${userId}`, {
                    method: 'PUT',
                    headers: {
                        'Authorization': `Bearer ${token}`,
                        'Content-Type': 'application/json'
                    },
                    body: JSON.stringify(updateData)
                });
                
                const data = await response.json();
                
                log(`📊 PUT Response Status: ${response.status}`, response.status === 200 ? 'success' : 'error');
                log('📊 Response Data:', 'info');
                log(data, 'info');
                
                if (response.status === 400) {
                    log('❌ 400 Bad Request - Validation Error', 'error');
                    if (data.error) {
                        log(`💡 Validation Error: ${data.error}`, 'error');
                    }
                    if (data.message) {
                        log(`💡 Error Message: ${data.message}`, 'error');
                    }
                } else if (response.status === 403) {
                    log('❌ 403 Forbidden - Insufficient permissions', 'error');
                } else if (response.status === 404) {
                    log('❌ 404 Not Found - User not found', 'error');
                } else if (response.status === 409) {
                    log('❌ 409 Conflict - Duplicate data', 'error');
                } else if (response.status === 200) {
                    log('✅ User updated successfully!', 'success');
                }
                
            } catch (error) {
                log(`❌ Network Error: ${error.message}`, 'error');
            }
        }

        // Test different validation scenarios
        async function testValidationScenarios() {
            log('\n🧪 Testing different validation scenarios...', 'info');
            
            const userId = document.getElementById('userId').value.trim();
            if (!userId) {
                log('❌ Please enter a user ID first', 'error');
                return;
            }
            
            const testCases = [
                {
                    name: 'Valid update',
                    data: { personalInfo: { firstName: 'Valid Name' } }
                },
                {
                    name: 'Invalid role',
                    data: { role: 'invalid-role' }
                },
                {
                    name: 'Invalid status',
                    data: { status: 'invalid-status' }
                },
                {
                    name: 'Invalid gender',
                    data: { profile: { gender: 'invalid-gender' } }
                },
                {
                    name: 'Invalid contract type',
                    data: { employment: { contractType: 'invalid-contract' } }
                }
            ];
            
            for (const testCase of testCases) {
                log(`\n🔬 Testing: ${testCase.name}`, 'info');
                document.getElementById('updateData').value = JSON.stringify(testCase.data, null, 2);
                await testUserUpdate();
                await new Promise(resolve => setTimeout(resolve, 1000)); // Wait 1 second between tests
            }
        }

        // Auto-run on page load
        window.onload = () => {
            log('🔍 User Update 400 Error Debugger Ready', 'info');
            log('\n💡 Common causes of 400 errors:', 'warning');
            log('1. Invalid role (must be: employee, admin, hr, manager, etc.)', 'warning');
            log('2. Invalid status (must be: active, vacation, resigned, inactive)', 'warning');
            log('3. Invalid gender (must be: male, female)', 'warning');
            log('4. Invalid marital status (must be: single, married, divorced, widowed)', 'warning');
            log('5. Invalid contract type (must be: full-time, part-time, contract, probation)', 'warning');
            log('6. Invalid employment status (must be: active, on-leave, vacation, inactive, terminated, resigned)', 'warning');
            
            // Add test scenarios button
            const testBtn = document.createElement('button');
            testBtn.textContent = 'Run All Validation Tests';
            testBtn.onclick = testValidationScenarios;
            document.querySelector('.test-section').appendChild(testBtn);
        };
    </script>
</body>
</html>
