<!DOCTYPE html>
<html>
<head>
    <title>Debug New Mission Issue</title>
    <style>
        body { font-family: Arial, sans-serif; margin: 20px; }
        .step { margin: 20px 0; padding: 15px; border: 1px solid #ddd; border-radius: 5px; }
        .success { background-color: #d4edda; border-color: #c3e6cb; }
        .info { background-color: #d1ecf1; border-color: #bee5eb; }
        .warning { background-color: #fff3cd; border-color: #ffeaa7; }
        .error { background-color: #f8d7da; border-color: #f5c6cb; }
        button { padding: 10px 20px; margin: 5px; cursor: pointer; }
        .json-output { background: #f8f9fa; padding: 15px; border: 1px solid #ddd; border-radius: 5px; font-family: monospace; white-space: pre-wrap; max-height: 400px; overflow-y: auto; }
        .highlight { background-color: yellow; padding: 2px 4px; }
    </style>
</head>
<body>
    <h1>🔍 Debug New Mission Issue</h1>
    
    <div class="step info">
        <h3>🎯 Issue</h3>
        <p>You created a mission but it's not showing in the "My Missions" tab. This tool will help identify the root cause.</p>
    </div>

    <div class="step">
        <h3>🚀 Diagnostic Actions</h3>
        <button onclick="runFullDiagnostic()">Run Full Diagnostic</button>
        <button onclick="checkRecentMissions()">Check Recent Missions</button>
        <button onclick="testUserMatching()">Test User ID Matching</button>
        <button onclick="clearResults()">Clear Results</button>
    </div>

    <div id="results" style="margin-top: 20px;"></div>

    <script>
        let currentToken = null;
        let currentUser = null;

        function log(message, type = 'info') {
            const results = document.getElementById('results');
            const color = type === 'error' ? '#dc3545' : type === 'success' ? '#28a745' : type === 'warning' ? '#ffc107' : '#007bff';
            results.innerHTML += `<div style="margin: 5px 0; padding: 8px; border-left: 4px solid ${color}; background: #f8f9fa;">${message}</div>`;
            console.log(message);
        }

        function displayJSON(title, data) {
            const results = document.getElementById('results');
            results.innerHTML += `
                <div style="margin: 20px 0;">
                    <h4>${title}</h4>
                    <div class="json-output">${JSON.stringify(data, null, 2)}</div>
                </div>
            `;
        }

        function clearResults() {
            document.getElementById('results').innerHTML = '';
        }

        async function getAuthToken() {
            if (currentToken) return currentToken;

            // Try to get token from localStorage first (if user is already logged in)
            const storedToken = localStorage.getItem('token') || localStorage.getItem('tenant_token');
            if (storedToken) {
                try {
                    const tokenPayload = JSON.parse(atob(storedToken.split('.')[1]));
                    currentUser = { _id: tokenPayload._id || tokenPayload.id || tokenPayload.userId };
                    currentToken = storedToken;
                    log('✅ Using existing authentication token', 'success');
                    return storedToken;
                } catch (e) {
                    log('⚠️ Stored token is invalid, will login fresh', 'warning');
                }
            }

            // Login fresh
            try {
                log('🔐 Logging in...');
                const loginResponse = await fetch('http://localhost:5000/api/v1/auth/login', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({
                        email: 'admin@techcorp.com',
                        password: 'admin123',
                        tenantId: 'techcorp_solutions'
                    })
                });
                
                if (!loginResponse.ok) {
                    log('❌ Login failed', 'error');
                    return null;
                }
                
                const loginData = await loginResponse.json();
                currentToken = loginData.data?.token;
                currentUser = loginData.data?.user;
                log('✅ Login successful', 'success');
                
                return currentToken;
            } catch (error) {
                log(`❌ Login error: ${error.message}`, 'error');
                return null;
            }
        }

        async function runFullDiagnostic() {
            log('🔍 Running full diagnostic for mission visibility issue...');
            clearResults();
            
            const token = await getAuthToken();
            if (!token) return;

            log(`👤 Current User ID: ${currentUser._id}`, 'info');
            
            try {
                // Step 1: Get all missions
                log('📊 Step 1: Fetching all missions...');
                const response = await fetch('http://localhost:5000/api/v1/missions', {
                    headers: { 'Authorization': `Bearer ${token}` }
                });
                
                if (!response.ok) {
                    log(`❌ Failed to fetch missions: ${response.status}`, 'error');
                    return;
                }
                
                const data = await response.json();
                const missions = data.data || [];
                
                log(`📋 Total missions in database: ${missions.length}`, 'info');
                
                if (missions.length === 0) {
                    log('❌ No missions found in database at all', 'error');
                    log('💡 The mission creation might have failed or the database is empty', 'warning');
                    return;
                }

                // Step 2: Check recent missions (last 24 hours)
                log('📅 Step 2: Checking for recent missions...');
                const now = new Date();
                const yesterday = new Date(now.getTime() - 24 * 60 * 60 * 1000);
                
                const recentMissions = missions.filter(mission => {
                    const createdAt = new Date(mission.createdAt || mission.dateCreated || 0);
                    return createdAt > yesterday;
                });
                
                log(`🕒 Recent missions (last 24h): ${recentMissions.length}`, recentMissions.length > 0 ? 'success' : 'warning');
                
                if (recentMissions.length > 0) {
                    log('📋 Recent missions found:', 'info');
                    recentMissions.forEach((mission, index) => {
                        const employeeId = mission.employee?._id || mission.employee;
                        const isCurrentUser = String(employeeId) === String(currentUser._id);
                        log(`  ${index + 1}. ${mission.location} - Employee: ${employeeId} - Yours: ${isCurrentUser}`, isCurrentUser ? 'success' : 'info');
                    });
                }

                // Step 3: Check user matching
                log('🔍 Step 3: Analyzing user ID matching...');
                const userMissions = missions.filter(mission => {
                    const missionUserId = mission.employee?._id || mission.employee;
                    const currentUserId = currentUser._id;
                    return String(missionUserId) === String(currentUserId);
                });
                
                log(`👤 Your missions: ${userMissions.length}`, userMissions.length > 0 ? 'success' : 'error');
                
                // Step 4: Detailed analysis
                log('🔬 Step 4: Detailed mission analysis...');
                
                if (missions.length > 0) {
                    const nullEmployeeMissions = missions.filter(m => !m.employee);
                    const otherUserMissions = missions.filter(m => m.employee && String(m.employee?._id || m.employee) !== String(currentUser._id));
                    
                    log(`📊 Mission breakdown:`, 'info');
                    log(`  - Total: ${missions.length}`, 'info');
                    log(`  - Yours: ${userMissions.length}`, userMissions.length > 0 ? 'success' : 'error');
                    log(`  - No employee assigned: ${nullEmployeeMissions.length}`, nullEmployeeMissions.length > 0 ? 'warning' : 'info');
                    log(`  - Other users: ${otherUserMissions.length}`, 'info');
                    
                    if (nullEmployeeMissions.length > 0) {
                        log('⚠️ Found missions with no employee assigned:', 'warning');
                        nullEmployeeMissions.forEach((mission, index) => {
                            log(`  ${index + 1}. ${mission.location} - Employee field: ${JSON.stringify(mission.employee)}`, 'warning');
                        });
                    }
                }

                // Step 5: Check the most recent mission
                if (missions.length > 0) {
                    log('🔍 Step 5: Checking most recent mission...');
                    const sortedMissions = missions.sort((a, b) => {
                        const dateA = new Date(a.createdAt || a.dateCreated || 0);
                        const dateB = new Date(b.createdAt || b.dateCreated || 0);
                        return dateB - dateA;
                    });
                    
                    const latestMission = sortedMissions[0];
                    const latestEmployeeId = latestMission.employee?._id || latestMission.employee;
                    const isLatestYours = String(latestEmployeeId) === String(currentUser._id);
                    
                    log(`📋 Most recent mission:`, 'info');
                    log(`  - Location: ${latestMission.location}`, 'info');
                    log(`  - Employee ID: ${latestEmployeeId}`, 'info');
                    log(`  - Your User ID: ${currentUser._id}`, 'info');
                    log(`  - Is yours: ${isLatestYours}`, isLatestYours ? 'success' : 'error');
                    log(`  - Created: ${latestMission.createdAt || latestMission.dateCreated || 'Unknown'}`, 'info');
                    
                    displayJSON('🔍 Latest Mission Details', latestMission);
                    
                    if (!isLatestYours) {
                        log('❌ PROBLEM IDENTIFIED: The most recent mission is not assigned to you!', 'error');
                        log('💡 This suggests the mission creation process is not properly setting the employee field', 'warning');
                    } else {
                        log('✅ The most recent mission is correctly assigned to you', 'success');
                        log('💡 If it\'s not showing in the UI, there might be a frontend filtering or rendering issue', 'warning');
                    }
                }

                // Display raw data for debugging
                displayJSON('📋 All Missions Raw Data', missions);
                displayJSON('👤 Your Missions', userMissions);
                
            } catch (error) {
                log(`❌ Diagnostic error: ${error.message}`, 'error');
            }
        }

        async function checkRecentMissions() {
            log('🕒 Checking recent missions...');
            
            const token = await getAuthToken();
            if (!token) return;

            try {
                const response = await fetch('http://localhost:5000/api/v1/missions', {
                    headers: { 'Authorization': `Bearer ${token}` }
                });
                
                if (response.ok) {
                    const data = await response.json();
                    const missions = data.data || [];
                    
                    // Sort by creation date
                    const sortedMissions = missions.sort((a, b) => {
                        const dateA = new Date(a.createdAt || a.dateCreated || 0);
                        const dateB = new Date(b.createdAt || b.dateCreated || 0);
                        return dateB - dateA;
                    });
                    
                    log(`📋 Last 5 missions (most recent first):`, 'info');
                    sortedMissions.slice(0, 5).forEach((mission, index) => {
                        const employeeId = mission.employee?._id || mission.employee;
                        const isYours = String(employeeId) === String(currentUser._id);
                        const createdAt = mission.createdAt || mission.dateCreated || 'Unknown';
                        
                        log(`${index + 1}. ${mission.location} - Employee: ${employeeId} - Yours: ${isYours} - Created: ${createdAt}`, isYours ? 'success' : 'info');
                    });
                    
                } else {
                    log('❌ Failed to fetch missions', 'error');
                }
                
            } catch (error) {
                log(`❌ Error checking recent missions: ${error.message}`, 'error');
            }
        }

        async function testUserMatching() {
            log('🔍 Testing user ID matching logic...');
            
            const token = await getAuthToken();
            if (!token) return;

            try {
                const response = await fetch('http://localhost:5000/api/v1/missions', {
                    headers: { 'Authorization': `Bearer ${token}` }
                });
                
                if (response.ok) {
                    const data = await response.json();
                    const missions = data.data || [];
                    
                    log(`👤 Current user ID: "${currentUser._id}" (type: ${typeof currentUser._id})`, 'info');
                    
                    missions.forEach((mission, index) => {
                        const missionUserId = mission.employee?._id || mission.employee;
                        
                        log(`Mission ${index + 1}: ${mission.location}`, 'info');
                        log(`  - Employee field: ${JSON.stringify(mission.employee)}`, 'info');
                        log(`  - Employee ID: "${missionUserId}" (type: ${typeof missionUserId})`, 'info');
                        log(`  - Strict equality: ${missionUserId === currentUser._id}`, 'info');
                        log(`  - String equality: ${String(missionUserId) === String(currentUser._id)}`, 'info');
                        log(`  - Would show in My Missions: ${String(missionUserId) === String(currentUser._id)}`, String(missionUserId) === String(currentUser._id) ? 'success' : 'error');
                        log('---', 'info');
                    });
                    
                } else {
                    log('❌ Failed to fetch missions for matching test', 'error');
                }
                
            } catch (error) {
                log(`❌ User matching test error: ${error.message}`, 'error');
            }
        }

        // Auto-load
        window.addEventListener('load', () => {
            log('🔍 Mission diagnostic tool loaded', 'info');
            log('💡 Click "Run Full Diagnostic" to analyze why your mission isn\'t showing', 'info');
        });
    </script>
</body>
</html>
