<!DOCTYPE html>
<html>
<head>
    <title>Debug Mission Data Structure</title>
    <style>
        body { font-family: Arial, sans-serif; margin: 20px; }
        .step { margin: 20px 0; padding: 15px; border: 1px solid #ddd; border-radius: 5px; }
        .success { background-color: #d4edda; border-color: #c3e6cb; }
        .info { background-color: #d1ecf1; border-color: #bee5eb; }
        .warning { background-color: #fff3cd; border-color: #ffeaa7; }
        .error { background-color: #f8d7da; border-color: #f5c6cb; }
        button { padding: 10px 20px; margin: 5px; cursor: pointer; }
        .json-output { background: #f8f9fa; padding: 15px; border: 1px solid #ddd; border-radius: 5px; font-family: monospace; white-space: pre-wrap; max-height: 400px; overflow-y: auto; }
    </style>
</head>
<body>
    <h1>🔍 Debug Mission Data Structure</h1>
    
    <div class="step info">
        <h3>🎯 Purpose</h3>
        <p>This tool will help us understand the exact structure of mission data and identify why missions aren't showing up for the current user.</p>
    </div>

    <div class="step">
        <h3>🚀 Debug Actions</h3>
        <button onclick="debugMissionData()">Debug Mission Data</button>
        <button onclick="debugUserData()">Debug User Data</button>
        <button onclick="createTestMission()">Create Test Mission</button>
        <button onclick="compareUserIds()">Compare User IDs</button>
    </div>

    <div id="results" style="margin-top: 20px;"></div>

    <script>
        let currentToken = null;
        let currentUser = null;

        function log(message, type = 'info') {
            const results = document.getElementById('results');
            const color = type === 'error' ? '#dc3545' : type === 'success' ? '#28a745' : '#007bff';
            results.innerHTML += `<div style="margin: 5px 0; padding: 8px; border-left: 4px solid ${color}; background: #f8f9fa;">${message}</div>`;
            console.log(message);
        }

        function displayJSON(title, data) {
            const results = document.getElementById('results');
            results.innerHTML += `
                <div style="margin: 20px 0;">
                    <h4>${title}</h4>
                    <div class="json-output">${JSON.stringify(data, null, 2)}</div>
                </div>
            `;
        }

        async function login() {
            if (currentToken) return currentToken;

            try {
                const loginResponse = await fetch('http://localhost:5000/api/v1/auth/login', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({
                        email: 'admin@techcorp.com',
                        password: 'admin123',
                        tenantId: 'techcorp_solutions'
                    })
                });
                
                if (!loginResponse.ok) {
                    log('❌ Login failed', 'error');
                    return null;
                }
                
                const loginData = await loginResponse.json();
                currentToken = loginData.data?.token;
                currentUser = loginData.data?.user;
                log('✅ Login successful', 'success');
                
                displayJSON('🔐 Login Response', loginData);
                
                return currentToken;
            } catch (error) {
                log(`❌ Login error: ${error.message}`, 'error');
                return null;
            }
        }

        async function debugMissionData() {
            log('🔍 Debugging mission data...');
            
            const token = await login();
            if (!token) return;

            try {
                // Get all missions
                const response = await fetch('http://localhost:5000/api/v1/missions', {
                    headers: { 'Authorization': `Bearer ${token}` }
                });
                
                if (response.ok) {
                    const data = await response.json();
                    log(`📊 Found ${data.data?.length || 0} missions`, 'info');
                    
                    displayJSON('📋 Raw Mission API Response', data);
                    
                    // Analyze each mission
                    if (data.data && Array.isArray(data.data)) {
                        data.data.forEach((mission, index) => {
                            log(`Mission ${index + 1}:`, 'info');
                            log(`  - ID: ${mission._id}`, 'info');
                            log(`  - Location: ${mission.location}`, 'info');
                            log(`  - Employee field: ${JSON.stringify(mission.employee)}`, 'info');
                            log(`  - Employee type: ${typeof mission.employee}`, 'info');
                            
                            if (typeof mission.employee === 'object' && mission.employee) {
                                log(`  - Employee._id: ${mission.employee._id}`, 'info');
                                log(`  - Employee.username: ${mission.employee.username}`, 'info');
                            }
                        });
                    }
                    
                } else {
                    log('❌ Failed to fetch missions', 'error');
                    const errorData = await response.json();
                    displayJSON('❌ Mission API Error', errorData);
                }
                
            } catch (error) {
                log(`❌ Mission debug error: ${error.message}`, 'error');
            }
        }

        async function debugUserData() {
            log('👤 Debugging user data...');
            
            const token = await login();
            if (!token) return;

            if (currentUser) {
                log(`Current User ID: ${currentUser._id}`, 'info');
                log(`Current User Type: ${typeof currentUser._id}`, 'info');
                displayJSON('👤 Current User Data', currentUser);
            }

            // Also get user from profile endpoint
            try {
                const profileResponse = await fetch('http://localhost:5000/api/v1/auth/profile', {
                    headers: { 'Authorization': `Bearer ${token}` }
                });
                
                if (profileResponse.ok) {
                    const profileData = await profileResponse.json();
                    displayJSON('👤 Profile API Response', profileData);
                } else {
                    log('❌ Failed to fetch profile', 'error');
                }
            } catch (error) {
                log(`❌ Profile debug error: ${error.message}`, 'error');
            }
        }

        async function createTestMission() {
            log('🧪 Creating test mission...');
            
            const token = await login();
            if (!token) return;

            const missionData = {
                employee: currentUser?._id,
                location: `Debug Test Location ${Date.now()}`,
                purpose: 'Debug test mission to check data structure',
                startDate: new Date().toISOString().split('T')[0],
                endDate: new Date().toISOString().split('T')[0],
                duration: 1
            };

            log(`Creating mission with employee ID: ${missionData.employee}`, 'info');
            displayJSON('📝 Mission Creation Data', missionData);

            try {
                const createResponse = await fetch('http://localhost:5000/api/v1/missions', {
                    method: 'POST',
                    headers: { 
                        'Authorization': `Bearer ${token}`,
                        'Content-Type': 'application/json'
                    },
                    body: JSON.stringify(missionData)
                });
                
                if (createResponse.ok) {
                    const createdMission = await createResponse.json();
                    log('✅ Mission created successfully', 'success');
                    displayJSON('✅ Created Mission Response', createdMission);
                    
                    // Now fetch missions again to see the structure
                    setTimeout(() => {
                        debugMissionData();
                    }, 1000);
                    
                } else {
                    const errorData = await createResponse.json();
                    log('❌ Failed to create mission', 'error');
                    displayJSON('❌ Mission Creation Error', errorData);
                }
                
            } catch (error) {
                log(`❌ Mission creation error: ${error.message}`, 'error');
            }
        }

        async function compareUserIds() {
            log('🔍 Comparing user IDs...');
            
            const token = await login();
            if (!token) return;

            try {
                // Get missions
                const missionsResponse = await fetch('http://localhost:5000/api/v1/missions', {
                    headers: { 'Authorization': `Bearer ${token}` }
                });
                
                if (missionsResponse.ok) {
                    const missionsData = await missionsResponse.json();
                    const missions = missionsData.data || [];
                    
                    log(`Current user ID: ${currentUser?._id} (type: ${typeof currentUser?._id})`, 'info');
                    
                    missions.forEach((mission, index) => {
                        const missionUserId = mission.employee?._id || mission.employee;
                        const currentUserId = currentUser?._id;
                        
                        log(`Mission ${index + 1}:`, 'info');
                        log(`  - Mission employee: ${missionUserId} (type: ${typeof missionUserId})`, 'info');
                        log(`  - Current user: ${currentUserId} (type: ${typeof currentUserId})`, 'info');
                        log(`  - Strict equality: ${missionUserId === currentUserId}`, 'info');
                        log(`  - String equality: ${String(missionUserId) === String(currentUserId)}`, 'info');
                        log(`  - Would show: ${missionUserId === currentUserId || String(missionUserId) === String(currentUserId)}`, 'info');
                        log('---', 'info');
                    });
                    
                } else {
                    log('❌ Failed to fetch missions for comparison', 'error');
                }
                
            } catch (error) {
                log(`❌ Comparison error: ${error.message}`, 'error');
            }
        }

        // Auto-load message
        window.addEventListener('load', () => {
            log('🔍 Mission data debug tool loaded. Click the buttons above to analyze the data.', 'info');
        });
    </script>
</body>
</html>
