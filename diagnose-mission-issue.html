<!DOCTYPE html>
<html>
<head>
    <title>🔍 Diagnose Mission Issue</title>
    <style>
        body { font-family: Arial, sans-serif; margin: 20px; line-height: 1.6; }
        .result { margin: 10px 0; padding: 10px; border: 1px solid #ddd; border-radius: 5px; }
        .success { background-color: #d4edda; border-color: #c3e6cb; }
        .error { background-color: #f8d7da; border-color: #f5c6cb; }
        .warning { background-color: #fff3cd; border-color: #ffeaa7; }
        .info { background-color: #d1ecf1; border-color: #bee5eb; }
        button { padding: 10px 20px; margin: 5px; cursor: pointer; background: #007bff; color: white; border: none; border-radius: 5px; }
        button:hover { background: #0056b3; }
        pre { background: #f8f9fa; padding: 10px; border-radius: 5px; overflow-x: auto; font-size: 12px; }
        .step { margin: 20px 0; padding: 15px; border-left: 4px solid #007bff; background: #f8f9fa; }
        .checklist { list-style-type: none; padding: 0; }
        .checklist li { margin: 8px 0; padding: 8px; background: white; border-radius: 5px; }
        .status { font-weight: bold; margin-right: 10px; }
        .pass { color: #28a745; }
        .fail { color: #dc3545; }
        .warn { color: #ffc107; }
    </style>
</head>
<body>
    <h1>🔍 Mission Issue Diagnostic Tool</h1>
    
    <div class="step">
        <h3>🎯 Purpose</h3>
        <p>This tool will systematically check all possible causes for the "no data shown" issue in the missions page.</p>
    </div>

    <div>
        <button onclick="runFullDiagnostic()">🚀 Run Full Diagnostic</button>
        <button onclick="quickFix()">⚡ Quick Fix Attempt</button>
        <button onclick="clearResults()">🧹 Clear Results</button>
    </div>

    <div id="results"></div>

    <script>
        let diagnosticResults = {};

        function log(message, type = 'info') {
            const results = document.getElementById('results');
            const className = type === 'error' ? 'error' : type === 'success' ? 'success' : type === 'warning' ? 'warning' : 'info';
            results.innerHTML += `<div class="result ${className}">${message}</div>`;
            console.log(message);
        }

        function clearResults() {
            document.getElementById('results').innerHTML = '';
            diagnosticResults = {};
        }

        function setStatus(check, passed, message = '') {
            diagnosticResults[check] = { passed, message };
        }

        function showSummary() {
            log('<h3>📊 Diagnostic Summary</h3>');
            
            const checks = [
                'serverRunning',
                'frontendRunning', 
                'authentication',
                'apiConnection',
                'missionsAPI',
                'userData',
                'tokenValid'
            ];
            
            let html = '<ul class="checklist">';
            checks.forEach(check => {
                const result = diagnosticResults[check];
                if (result) {
                    const statusClass = result.passed ? 'pass' : 'fail';
                    const statusIcon = result.passed ? '✅' : '❌';
                    html += `<li><span class="status ${statusClass}">${statusIcon}</span> ${check}: ${result.message}</li>`;
                }
            });
            html += '</ul>';
            
            log(html);
            
            // Provide recommendations
            const failedChecks = Object.keys(diagnosticResults).filter(key => !diagnosticResults[key].passed);
            if (failedChecks.length > 0) {
                log('<h3>🔧 Recommended Actions</h3>', 'warning');
                
                if (failedChecks.includes('serverRunning')) {
                    log('1. Start the backend server: <code>npm run dev</code> in the server directory', 'warning');
                }
                if (failedChecks.includes('authentication')) {
                    log('2. Login to the HR app: <a href="http://localhost:3000" target="_blank">http://localhost:3000</a>', 'warning');
                }
                if (failedChecks.includes('apiConnection')) {
                    log('3. Check CORS settings and network connectivity', 'warning');
                }
                if (failedChecks.includes('missionsAPI')) {
                    log('4. Check database connection and mission model', 'warning');
                }
            } else {
                log('✅ All checks passed! The issue might be in the frontend React component.', 'success');
                log('💡 Try refreshing the missions page or check browser console for React errors.', 'info');
            }
        }

        async function checkServerRunning() {
            log('🔍 1. Checking if backend server is running...');
            
            try {
                const response = await fetch('http://localhost:5000/api/v1/', {
                    method: 'GET',
                    timeout: 5000
                });
                
                if (response.ok) {
                    setStatus('serverRunning', true, 'Backend server is running on port 5000');
                    log('✅ Backend server is running', 'success');
                    return true;
                } else {
                    setStatus('serverRunning', false, `Server responded with status ${response.status}`);
                    log(`❌ Server responded with status ${response.status}`, 'error');
                    return false;
                }
            } catch (error) {
                setStatus('serverRunning', false, `Cannot connect to server: ${error.message}`);
                log(`❌ Cannot connect to backend server: ${error.message}`, 'error');
                return false;
            }
        }

        async function checkFrontendRunning() {
            log('🔍 2. Checking if frontend is running...');
            
            try {
                const response = await fetch('http://localhost:3000/', {
                    method: 'GET',
                    mode: 'no-cors'
                });
                
                setStatus('frontendRunning', true, 'Frontend is running on port 3000');
                log('✅ Frontend is running', 'success');
                return true;
            } catch (error) {
                setStatus('frontendRunning', false, `Cannot connect to frontend: ${error.message}`);
                log(`❌ Cannot connect to frontend: ${error.message}`, 'error');
                return false;
            }
        }

        async function checkAuthentication() {
            log('🔍 3. Checking authentication status...');
            
            const token = localStorage.getItem('token') || localStorage.getItem('tenant_token');
            
            if (!token) {
                setStatus('authentication', false, 'No authentication token found');
                log('❌ No authentication token found in localStorage', 'error');
                log('💡 Please login to the HR app first', 'warning');
                return false;
            }
            
            try {
                // Try to decode JWT
                const payload = JSON.parse(atob(token.split('.')[1]));
                const now = Date.now() / 1000;
                
                if (payload.exp && payload.exp < now) {
                    setStatus('authentication', false, 'Authentication token has expired');
                    log('❌ Authentication token has expired', 'error');
                    return false;
                } else {
                    setStatus('authentication', true, `Authenticated as ${payload.email || payload.username || 'user'}`);
                    log(`✅ Authenticated as ${payload.email || payload.username || 'user'}`, 'success');
                    return true;
                }
            } catch (error) {
                setStatus('authentication', false, 'Invalid token format');
                log('❌ Invalid token format', 'error');
                return false;
            }
        }

        async function checkAPIConnection() {
            log('🔍 4. Testing API connection...');
            
            const token = localStorage.getItem('token') || localStorage.getItem('tenant_token');
            
            if (!token) {
                setStatus('apiConnection', false, 'No token for API test');
                return false;
            }
            
            try {
                const response = await fetch('http://localhost:5000/api/v1/auth/profile', {
                    headers: {
                        'Authorization': `Bearer ${token}`,
                        'Content-Type': 'application/json'
                    }
                });
                
                if (response.ok) {
                    const data = await response.json();
                    setStatus('apiConnection', true, 'API connection working');
                    log('✅ API connection working', 'success');
                    return true;
                } else {
                    setStatus('apiConnection', false, `API returned status ${response.status}`);
                    log(`❌ API returned status ${response.status}`, 'error');
                    return false;
                }
            } catch (error) {
                setStatus('apiConnection', false, `API connection failed: ${error.message}`);
                log(`❌ API connection failed: ${error.message}`, 'error');
                return false;
            }
        }

        async function checkMissionsAPI() {
            log('🔍 5. Testing missions API specifically...');
            
            const token = localStorage.getItem('token') || localStorage.getItem('tenant_token');
            
            if (!token) {
                setStatus('missionsAPI', false, 'No token for missions API test');
                return false;
            }
            
            try {
                const response = await fetch('http://localhost:5000/api/v1/missions', {
                    headers: {
                        'Authorization': `Bearer ${token}`,
                        'Content-Type': 'application/json'
                    }
                });
                
                if (response.ok) {
                    const data = await response.json();
                    const missionCount = data.data?.length || 0;
                    setStatus('missionsAPI', true, `Missions API working, found ${missionCount} missions`);
                    log(`✅ Missions API working, found ${missionCount} missions`, 'success');
                    
                    if (missionCount === 0) {
                        log('⚠️ No missions found in database. This might be why the page shows no data.', 'warning');
                        log('💡 Try creating a test mission to verify the functionality.', 'info');
                    }
                    
                    return true;
                } else {
                    const errorData = await response.json();
                    setStatus('missionsAPI', false, `Missions API failed: ${errorData.message || response.status}`);
                    log(`❌ Missions API failed: ${errorData.message || response.status}`, 'error');
                    return false;
                }
            } catch (error) {
                setStatus('missionsAPI', false, `Missions API error: ${error.message}`);
                log(`❌ Missions API error: ${error.message}`, 'error');
                return false;
            }
        }

        async function checkUserData() {
            log('🔍 6. Checking user data and permissions...');
            
            const token = localStorage.getItem('token') || localStorage.getItem('tenant_token');
            
            if (!token) {
                setStatus('userdata', false, 'No token for user data check');
                return false;
            }
            
            try {
                const response = await fetch('http://localhost:5000/api/v1/auth/profile', {
                    headers: {
                        'Authorization': `Bearer ${token}`,
                        'Content-Type': 'application/json'
                    }
                });
                
                if (response.ok) {
                    const data = await response.json();
                    const user = data.data || data;
                    
                    setStatus('userdata', true, `User: ${user.email}, Role: ${user.role}, ID: ${user._id}`);
                    log(`✅ User data: ${user.email}, Role: ${user.role}`, 'success');
                    log(`👤 User ID: ${user._id}`, 'info');
                    
                    return user;
                } else {
                    setStatus('userdata', false, 'Failed to get user data');
                    log('❌ Failed to get user data', 'error');
                    return false;
                }
            } catch (error) {
                setStatus('userdata', false, `User data error: ${error.message}`);
                log(`❌ User data error: ${error.message}`, 'error');
                return false;
            }
        }

        async function runFullDiagnostic() {
            clearResults();
            log('<h2>🚀 Running Full Diagnostic</h2>');
            
            const serverOk = await checkServerRunning();
            const frontendOk = await checkFrontendRunning();
            const authOk = await checkAuthentication();
            
            if (serverOk && authOk) {
                const apiOk = await checkAPIConnection();
                const missionsOk = await checkMissionsAPI();
                const userData = await checkUserData();
            }
            
            showSummary();
        }

        async function quickFix() {
            log('<h2>⚡ Attempting Quick Fix</h2>');
            
            // Try to login and create a test mission
            try {
                log('🔐 Attempting login...');
                const loginResponse = await fetch('http://localhost:5000/api/v1/auth/login', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({
                        email: 'admin@techcorp.com',
                        password: 'admin123',
                        tenantId: 'techcorp_solutions'
                    })
                });
                
                if (loginResponse.ok) {
                    const loginData = await loginResponse.json();
                    const token = loginData.data?.token;
                    
                    if (token) {
                        localStorage.setItem('token', token);
                        localStorage.setItem('tenant_token', token);
                        log('✅ Login successful, token stored', 'success');
                        
                        // Create a test mission
                        log('📝 Creating test mission...');
                        const missionResponse = await fetch('http://localhost:5000/api/v1/missions', {
                            method: 'POST',
                            headers: {
                                'Authorization': `Bearer ${token}`,
                                'Content-Type': 'application/json'
                            },
                            body: JSON.stringify({
                                employee: loginData.data.user._id,
                                location: `Quick Fix Test ${Date.now()}`,
                                purpose: 'Test mission created by diagnostic tool',
                                startDate: new Date().toISOString().split('T')[0],
                                endDate: new Date().toISOString().split('T')[0],
                                duration: 1
                            })
                        });
                        
                        if (missionResponse.ok) {
                            log('✅ Test mission created successfully', 'success');
                            log('💡 Now try refreshing the missions page in the HR app', 'info');
                        } else {
                            log('❌ Failed to create test mission', 'error');
                        }
                    }
                } else {
                    log('❌ Login failed', 'error');
                }
            } catch (error) {
                log(`❌ Quick fix failed: ${error.message}`, 'error');
            }
        }

        // Auto-run diagnostic on load
        window.addEventListener('load', () => {
            log('🔍 Mission diagnostic tool loaded');
            log('💡 Click "Run Full Diagnostic" to identify the issue');
        });
    </script>
</body>
</html>
