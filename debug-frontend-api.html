<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Debug Frontend API Calls</title>
    <style>
        body { font-family: Arial, sans-serif; margin: 20px; }
        .section { margin: 20px 0; padding: 15px; border: 1px solid #ddd; border-radius: 5px; }
        .error { color: red; }
        .success { color: green; }
        .info { color: blue; }
        .warning { color: orange; }
        pre { background: #f5f5f5; padding: 10px; border-radius: 3px; overflow-x: auto; }
        button { padding: 10px 15px; margin: 5px; cursor: pointer; }
        input { padding: 8px; margin: 5px; width: 300px; }
    </style>
</head>
<body>
    <h1>Debug Frontend API Calls</h1>
    
    <div class="section">
        <h3>Environment Check</h3>
        <div id="envCheck"></div>
    </div>

    <div class="section">
        <h3>Test Direct API Call</h3>
        <button onclick="testDirectAPI()">Test API Directly</button>
        <div id="directResult"></div>
    </div>

    <div class="section">
        <h3>Test with Frontend Service</h3>
        <button onclick="testFrontendService()">Test Frontend Service</button>
        <div id="frontendResult"></div>
    </div>

    <div class="section">
        <h3>Check Local Storage</h3>
        <button onclick="checkStorage()">Check Storage</button>
        <div id="storageResult"></div>
    </div>

    <script>
        // Check environment
        function checkEnvironment() {
            const envInfo = {
                currentURL: window.location.href,
                userAgent: navigator.userAgent,
                localStorage: {
                    token: localStorage.getItem('token') ? 'Present' : 'Missing',
                    tenant_token: localStorage.getItem('tenant_token') ? 'Present' : 'Missing'
                }
            };

            document.getElementById('envCheck').innerHTML = `
                <div class="info">Current URL: ${envInfo.currentURL}</div>
                <div class="info">User Agent: ${envInfo.userAgent}</div>
                <div class="info">Token in localStorage: ${envInfo.localStorage.token}</div>
                <div class="info">Tenant token in localStorage: ${envInfo.localStorage.tenant_token}</div>
            `;
        }

        async function testDirectAPI() {
            document.getElementById('directResult').innerHTML = '<div class="info">Testing...</div>';
            
            try {
                // First login
                const loginResponse = await fetch('http://localhost:5000/api/v1/auth/login', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({
                        username: 'admin',
                        password: 'admin123', // Update with correct password
                        tenantId: 'techcorp_solutions'
                    })
                });

                const loginData = await loginResponse.json();
                
                if (!loginData.success) {
                    document.getElementById('directResult').innerHTML = 
                        `<div class="error">❌ Login failed: ${loginData.message}</div>`;
                    return;
                }

                // Store token
                localStorage.setItem('token', loginData.token);
                
                // Test missions API
                const missionsResponse = await fetch('http://localhost:5000/api/v1/missions', {
                    method: 'GET',
                    headers: {
                        'Authorization': `Bearer ${loginData.token}`,
                        'Content-Type': 'application/json'
                    }
                });

                const missionsData = await missionsResponse.json();
                
                document.getElementById('directResult').innerHTML = `
                    <div class="success">✅ Direct API test completed</div>
                    <div class="info">Login Status: ${loginResponse.status}</div>
                    <div class="info">Missions Status: ${missionsResponse.status}</div>
                    <div class="info">Missions Count: ${missionsData.data ? missionsData.data.length : 0}</div>
                    <pre>${JSON.stringify(missionsData, null, 2)}</pre>
                `;

            } catch (error) {
                document.getElementById('directResult').innerHTML = 
                    `<div class="error">❌ Error: ${error.message}</div>`;
            }
        }

        async function testFrontendService() {
            document.getElementById('frontendResult').innerHTML = '<div class="info">Testing frontend service...</div>';
            
            try {
                // This simulates what the React app does
                const token = localStorage.getItem('token') || localStorage.getItem('tenant_token');
                
                if (!token) {
                    document.getElementById('frontendResult').innerHTML = 
                        '<div class="error">❌ No token found. Please run direct API test first.</div>';
                    return;
                }

                // Test with cache-busting parameters (like the frontend does)
                const params = new URLSearchParams({
                    _t: Date.now(),
                    v: 'test-version',
                    _r: Math.random().toString(36).substr(2, 9)
                });

                const response = await fetch(`http://localhost:5000/api/v1/missions?${params}`, {
                    method: 'GET',
                    headers: {
                        'Authorization': `Bearer ${token}`,
                        'Content-Type': 'application/json'
                    }
                });

                const data = await response.json();
                
                document.getElementById('frontendResult').innerHTML = `
                    <div class="success">✅ Frontend service test completed</div>
                    <div class="info">Status: ${response.status}</div>
                    <div class="info">Success: ${data.success}</div>
                    <div class="info">Data Count: ${data.data ? data.data.length : 0}</div>
                    <pre>${JSON.stringify(data, null, 2)}</pre>
                `;

            } catch (error) {
                document.getElementById('frontendResult').innerHTML = 
                    `<div class="error">❌ Error: ${error.message}</div>`;
            }
        }

        function checkStorage() {
            const storage = {
                token: localStorage.getItem('token'),
                tenant_token: localStorage.getItem('tenant_token'),
                user: localStorage.getItem('user'),
                allKeys: Object.keys(localStorage)
            };

            document.getElementById('storageResult').innerHTML = `
                <div class="info">All localStorage keys: ${storage.allKeys.join(', ')}</div>
                <pre>${JSON.stringify(storage, null, 2)}</pre>
            `;
        }

        // Run environment check on load
        window.onload = checkEnvironment;
    </script>
</body>
</html>
