<!DOCTYPE html>
<html>
<head>
    <title>Test Authentication and Missions</title>
    <style>
        body { font-family: Arial, sans-serif; margin: 20px; }
        .result { margin: 10px 0; padding: 10px; border: 1px solid #ddd; border-radius: 5px; }
        .success { background-color: #d4edda; }
        .error { background-color: #f8d7da; }
        .warning { background-color: #fff3cd; }
        button { padding: 10px 20px; margin: 5px; cursor: pointer; }
        pre { background: #f8f9fa; padding: 10px; border-radius: 5px; overflow-x: auto; font-size: 12px; }
        .step { margin: 20px 0; padding: 15px; border-left: 4px solid #007bff; background: #f8f9fa; }
    </style>
</head>
<body>
    <h1>🔍 Test Authentication and Missions</h1>
    
    <div class="step">
        <h3>📋 Instructions</h3>
        <ol>
            <li>Make sure you're logged into the HR app in another tab</li>
            <li>Click "Check Authentication" to verify login status</li>
            <li>Click "Test Missions API" to check if missions are accessible</li>
            <li>If authentication fails, login to the HR app first</li>
        </ol>
    </div>

    <div>
        <button onclick="checkAuthentication()">Check Authentication</button>
        <button onclick="testMissionsAPI()">Test Missions API</button>
        <button onclick="loginAndTest()">Login and Test</button>
        <button onclick="clearResults()">Clear Results</button>
    </div>

    <div id="results"></div>

    <script>
        function log(message, type = 'info') {
            const results = document.getElementById('results');
            const className = type === 'error' ? 'error' : type === 'success' ? 'success' : type === 'warning' ? 'warning' : '';
            results.innerHTML += `<div class="result ${className}">${message}</div>`;
            console.log(message);
        }

        function clearResults() {
            document.getElementById('results').innerHTML = '';
        }

        function checkAuthentication() {
            log('🔐 Checking authentication status...');
            
            // Check localStorage for tokens
            const token = localStorage.getItem('token');
            const tenantToken = localStorage.getItem('tenant_token');
            
            if (token) {
                log('✅ Token found in localStorage', 'success');
                log(`Token preview: ${token.substring(0, 20)}...`);
            } else {
                log('❌ No token found in localStorage', 'error');
            }
            
            if (tenantToken) {
                log('✅ Tenant token found in localStorage', 'success');
                log(`Tenant token preview: ${tenantToken.substring(0, 20)}...`);
            } else {
                log('⚠️ No tenant token found in localStorage', 'warning');
            }
            
            // Check sessionStorage as well
            const sessionToken = sessionStorage.getItem('token');
            if (sessionToken) {
                log('✅ Token found in sessionStorage', 'success');
            }
            
            // Try to decode JWT to see user info
            const activeToken = token || tenantToken;
            if (activeToken) {
                try {
                    const payload = JSON.parse(atob(activeToken.split('.')[1]));
                    log('✅ Token decoded successfully', 'success');
                    log(`<pre>Token payload: ${JSON.stringify(payload, null, 2)}</pre>`);
                } catch (error) {
                    log('❌ Failed to decode token', 'error');
                }
            }
        }

        async function testMissionsAPI() {
            log('📋 Testing missions API...');
            
            const token = localStorage.getItem('token') || localStorage.getItem('tenant_token');
            
            if (!token) {
                log('❌ No authentication token found. Please login first.', 'error');
                return;
            }
            
            try {
                log('🔍 Making request to missions API...');
                const response = await fetch('http://localhost:5000/api/v1/missions', {
                    headers: {
                        'Authorization': `Bearer ${token}`,
                        'Content-Type': 'application/json'
                    }
                });
                
                log(`📊 Response status: ${response.status}`);
                
                const data = await response.json();
                
                if (response.ok) {
                    log('✅ Missions API working', 'success');
                    log(`📊 Found ${data.data?.length || 0} missions`);
                    
                    if (data.data && data.data.length > 0) {
                        log(`<pre>Sample mission: ${JSON.stringify(data.data[0], null, 2)}</pre>`);
                        
                        // Analyze employee fields
                        data.data.forEach((mission, index) => {
                            const employeeField = mission.employee;
                            log(`Mission ${index + 1}: Employee field type = ${typeof employeeField}, Value = ${JSON.stringify(employeeField)}`);
                        });
                    } else {
                        log('⚠️ No missions found in database', 'warning');
                    }
                } else {
                    log('❌ Missions API failed', 'error');
                    log(`<pre>Error response: ${JSON.stringify(data, null, 2)}</pre>`);
                }
            } catch (error) {
                log(`❌ Missions request failed: ${error.message}`, 'error');
                log('💡 This could be a CORS issue or server not running');
            }
        }

        async function loginAndTest() {
            log('🔐 Attempting login and test...');
            
            try {
                // First, try to login
                const loginResponse = await fetch('http://localhost:5000/api/v1/auth/login', {
                    method: 'POST',
                    headers: {
                        'Content-Type': 'application/json',
                    },
                    body: JSON.stringify({
                        email: 'admin@techcorp.com',
                        password: 'admin123',
                        tenantId: 'techcorp_solutions'
                    })
                });
                
                const loginData = await loginResponse.json();
                
                if (loginResponse.ok) {
                    log('✅ Login successful', 'success');
                    
                    // Store token
                    const token = loginData.data?.token;
                    if (token) {
                        localStorage.setItem('token', token);
                        log('✅ Token stored in localStorage', 'success');
                    }
                    
                    // Now test missions API
                    setTimeout(() => {
                        testMissionsAPI();
                    }, 500);
                    
                } else {
                    log('❌ Login failed', 'error');
                    log(`<pre>Login error: ${JSON.stringify(loginData, null, 2)}</pre>`);
                }
            } catch (error) {
                log(`❌ Login request failed: ${error.message}`, 'error');
            }
        }

        // Auto-check on load
        window.addEventListener('load', () => {
            log('🔍 Authentication and missions test loaded');
            log('💡 Click "Check Authentication" to see current login status');
            
            // Auto-check authentication
            setTimeout(() => {
                checkAuthentication();
            }, 1000);
        });
    </script>
</body>
</html>
