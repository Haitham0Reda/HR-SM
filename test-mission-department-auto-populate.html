<!DOCTYPE html>
<html>
<head>
    <title>Test Mission Department Auto-Population</title>
    <style>
        body { font-family: Arial, sans-serif; margin: 20px; }
        .success { color: green; }
        .error { color: red; }
        .warning { color: orange; }
        .info { color: blue; }
        pre { background: #f5f5f5; padding: 10px; border-radius: 5px; overflow-x: auto; }
        .test-section { margin: 20px 0; padding: 15px; border: 1px solid #ddd; border-radius: 5px; }
        button { padding: 10px 20px; margin: 5px; background: #007bff; color: white; border: none; border-radius: 5px; cursor: pointer; }
        button:hover { background: #0056b3; }
    </style>
</head>
<body>
    <h1>🔧 Test Mission Department Auto-Population</h1>
    <div id="output"></div>
    
    <div class="test-section">
        <h3>Quick Tests</h3>
        <button onclick="checkUserDepartment()">Check User Department</button>
        <button onclick="checkDepartments()">Check Available Departments</button>
        <button onclick="testMissionCreation()">Test Mission Creation Flow</button>
    </div>
    
    <script>
        const log = (message, type = 'info') => {
            console.log(message);
            const div = document.createElement('div');
            div.className = type;
            div.innerHTML = typeof message === 'object' ? `<pre>${JSON.stringify(message, null, 2)}</pre>` : `<p>${message}</p>`;
            document.getElementById('output').appendChild(div);
        };

        async function checkUserDepartment() {
            log('🔍 Checking current user department...', 'info');
            
            const token = localStorage.getItem('tenant_token');
            if (!token) {
                log('❌ No token found in localStorage', 'error');
                return;
            }
            
            // Decode token to get user ID
            let userId;
            try {
                const payload = JSON.parse(atob(token.split('.')[1]));
                userId = payload.userId;
                log(`👤 Current user ID: ${userId}`, 'info');
            } catch (e) {
                log('❌ Failed to decode token', 'error');
                return;
            }
            
            try {
                // Get user details
                const response = await fetch(`http://localhost:5000/api/v1/users/${userId}`, {
                    headers: {
                        'Authorization': `Bearer ${token}`,
                        'Content-Type': 'application/json'
                    }
                });
                
                const data = await response.json();
                
                if (response.status === 200 && data.success) {
                    const user = data.data;
                    log('👤 User Details:', 'success');
                    log(user, 'info');
                    
                    if (user.department) {
                        log('🏢 User Department Found:', 'success');
                        log(`   Department ID: ${typeof user.department === 'object' ? user.department._id : user.department}`, 'success');
                        log(`   Department Name: ${typeof user.department === 'object' ? user.department.name : 'ID only'}`, 'success');
                        
                        // Store for later use
                        window.currentUserDepartment = user.department;
                    } else {
                        log('⚠️ User has no department assigned', 'warning');
                        log('💡 This means the department field will not be auto-populated', 'warning');
                    }
                } else {
                    log(`❌ Failed to get user details: ${data.message}`, 'error');
                }
                
            } catch (error) {
                log(`❌ Network Error: ${error.message}`, 'error');
            }
        }

        async function checkDepartments() {
            log('🏢 Checking available departments...', 'info');
            
            const token = localStorage.getItem('tenant_token');
            if (!token) {
                log('❌ No token found in localStorage', 'error');
                return;
            }
            
            try {
                const response = await fetch('http://localhost:5000/api/v1/departments', {
                    headers: {
                        'Authorization': `Bearer ${token}`,
                        'Content-Type': 'application/json'
                    }
                });
                
                const data = await response.json();
                
                if (response.status === 200 && data.success) {
                    const departments = data.data;
                    log(`📋 Found ${departments.length} departments:`, 'success');
                    
                    departments.forEach((dept, i) => {
                        log(`   ${i + 1}. ${dept.name} (ID: ${dept._id})`, 'info');
                    });
                    
                    // Check if user's department is in the list
                    if (window.currentUserDepartment) {
                        const userDeptId = typeof window.currentUserDepartment === 'object' 
                            ? window.currentUserDepartment._id 
                            : window.currentUserDepartment;
                            
                        const foundDept = departments.find(d => d._id === userDeptId);
                        if (foundDept) {
                            log(`✅ User's department "${foundDept.name}" is available in the list`, 'success');
                        } else {
                            log(`❌ User's department (ID: ${userDeptId}) not found in available departments`, 'error');
                        }
                    }
                    
                } else {
                    log(`❌ Failed to get departments: ${data.message}`, 'error');
                }
                
            } catch (error) {
                log(`❌ Network Error: ${error.message}`, 'error');
            }
        }

        async function testMissionCreation() {
            log('🎯 Testing mission creation flow...', 'info');
            
            // First check user department
            await checkUserDepartment();
            
            if (!window.currentUserDepartment) {
                log('⚠️ Cannot test auto-population - user has no department', 'warning');
                return;
            }
            
            const userDeptId = typeof window.currentUserDepartment === 'object' 
                ? window.currentUserDepartment._id 
                : window.currentUserDepartment;
            
            log('🔧 Simulating mission form initialization...', 'info');
            log(`✅ Department should auto-populate with: ${userDeptId}`, 'success');
            
            // Test the actual mission creation
            log('\n📝 Testing actual mission creation with auto-populated department...', 'info');
            
            const token = localStorage.getItem('tenant_token');
            const testMissionData = {
                location: 'Test Location - Auto Department',
                purpose: 'Testing auto-population of department field',
                startDate: new Date().toISOString().split('T')[0],
                endDate: new Date().toISOString().split('T')[0],
                relatedDepartment: userDeptId, // This should be auto-populated
                duration: 1
            };
            
            try {
                const response = await fetch('http://localhost:5000/api/v1/missions', {
                    method: 'POST',
                    headers: {
                        'Authorization': `Bearer ${token}`,
                        'Content-Type': 'application/json'
                    },
                    body: JSON.stringify(testMissionData)
                });
                
                const data = await response.json();
                
                if (response.status === 201) {
                    log('✅ Mission created successfully with auto-populated department!', 'success');
                    log('📋 Created mission:', 'success');
                    log(data.data, 'info');
                } else {
                    log(`❌ Failed to create mission: ${data.message}`, 'error');
                }
                
            } catch (error) {
                log(`❌ Network Error: ${error.message}`, 'error');
            }
        }

        // Auto-run basic checks on page load
        window.onload = async () => {
            log('🔍 Mission Department Auto-Population Tester Ready', 'info');
            log('\n💡 This tool tests if the user\'s department is properly auto-populated in the mission creation form.', 'warning');
            log('\n🎯 Expected behavior:', 'info');
            log('1. When creating a new mission, the "Related Department" field should automatically show the user\'s department', 'info');
            log('2. The user can still change it if needed', 'info');
            log('3. The helper text should indicate it was auto-selected', 'info');
            
            // Run initial check
            await checkUserDepartment();
        };
    </script>
</body>
</html>
