# Docker Compose for PostgreSQL Databases
# This file sets up both PostgreSQL databases needed for the migration:
# 1. License Server Database (hrsm-licenses)
# 2. Main Application Database (hrsm_platform)

version: '3.8'

services:
  # PostgreSQL Database Server
  postgres:
    image: postgres:14-alpine
    container_name: hrms-postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: hrms_admin
      POSTGRES_PASSWORD: hrms_secure_password_2024
      POSTGRES_DB: postgres
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./scripts/init-databases.sql:/docker-entrypoint-initdb.d/init-databases.sql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U hrms_admin"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - hrms-network

  # pgAdmin - PostgreSQL Web UI (Optional)
  pgadmin:
    image: dpage/pgadmin4:latest
    container_name: hrms-pgadmin
    restart: unless-stopped
    environment:
      PGADMIN_DEFAULT_EMAIL: admin@hrms.local
      PGADMIN_DEFAULT_PASSWORD: admin123
      PGADMIN_CONFIG_SERVER_MODE: 'False'
    ports:
      - "5050:80"
    volumes:
      - pgadmin_data:/var/lib/pgadmin
    depends_on:
      - postgres
    networks:
      - hrms-network

volumes:
  postgres_data:
    driver: local
  pgadmin_data:
    driver: local

networks:
  hrms-network:
    driver: bridge

# Usage Instructions:
# 
# 1. Start PostgreSQL databases:
#    docker-compose -f docker-compose.postgresql.yml up -d
#
# 2. Stop databases:
#    docker-compose -f docker-compose.postgresql.yml down
#
# 3. Stop and remove all data:
#    docker-compose -f docker-compose.postgresql.yml down -v
#
# 4. View logs:
#    docker-compose -f docker-compose.postgresql.yml logs -f postgres
#
# 5. Access pgAdmin (optional):
#    Open http://localhost:5050
#    Email: admin@hrms.local
#    Password: admin123
#
# 6. Update your .env file with:
#    LICENSE_DATABASE_URL=postgresql://hrms_admin:hrms_secure_password_2024@localhost:5432/hrsm-licenses
#    MAIN_DATABASE_URL=postgresql://hrms_admin:hrms_secure_password_2024@localhost:5432/hrsm_platform
#
# 7. Test connections:
#    npm run test-connections
